name: Import verified Petal Wake v0.1.22 source

on:
  push:
    paths:
      - .github/workflows/import-petal-wake-022.yml

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify draft release source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download v0.1.22 --repo ClownChowder/petal-wake --pattern petal-wake-source.zip --dir /tmp
          echo '1f81d1f64078acfd07125403c08541e95c14f0503768a5b7c99b74624b00ca28  /tmp/petal-wake-source.zip' | sha256sum --check
          mkdir -p /tmp/petal-wake-source
          unzip -q /tmp/petal-wake-source.zip -d /tmp/petal-wake-source
          rsync -a /tmp/petal-wake-source/Petal-Wake-source-0.1.22/ ./
      - name: Commit complete source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Source already current'
            exit 0
          fi
          git commit -m 'Publish complete Petal Wake v0.1.22 source'
          git push origin HEAD:main
