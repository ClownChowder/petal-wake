name: Import Petal Wake v0.1.21 source

on:
  push:
    paths:
      - .github/workflows/import-petal-wake-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify release source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/petal-wake-source.zip \
            https://github.com/ClownChowder/petal-wake/releases/download/v0.1.21/petal-wake-source.zip
          echo '1a218198f09254f4019b4c86305904ce5528fb63cdc491e502f04f8fcfab59cf  /tmp/petal-wake-source.zip' | sha256sum --check
          mkdir -p /tmp/petal-wake-source
          unzip -q /tmp/petal-wake-source.zip -d /tmp/petal-wake-source
          rsync -a /tmp/petal-wake-source/Petal-Wake-source-0.1.21/ ./
      - name: Commit complete source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Source already current'
            exit 0
          fi
          git commit -m 'Publish complete Petal Wake v0.1.21 source'
          git push origin HEAD:main
